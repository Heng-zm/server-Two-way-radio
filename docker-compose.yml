version: '3.8'

services:
  twowayradio:
    build: .
    container_name: twowayradio-server
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "5005:5005/udp"
    environment:
      - TZ=UTC
      - PORT=8080
      - UDP_PORT=5005
      - TOT_SECONDS=60
    volumes:
      - ./data/uploads:/app/data/uploads
